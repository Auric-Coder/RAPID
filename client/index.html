    <title>RAPID | Command & Dispatch Portal</title>
    <!-- Google Fonts -->
    <!-- Step 16 (performance): Lighthouse measured this as render-blocking
         (~881ms wasted). `rel="preload"` fetches it with high priority
         without blocking first paint on it; the onload swap then applies
         it once it arrives. Fonts already declare `display=swap` in the
         URL, so text remains visible with a fallback font throughout -
         this changes nothing about what's shown, only when the CSS
         itself is allowed to block rendering. <noscript> covers the rare
         case of JS disabled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <!-- Leaflet CSS moved to a JS-level import in RapidMap.jsx/Help.jsx
         (Step 16) - this <link> previously loaded on every page, including
         /login, unconditionally. It's now bundled into whichever lazy
         chunk actually needs it (Dashboard or Help), matching Step 11's
         code-splitting for the JS that uses it, and is no longer fetched
         from an external unpkg CDN at all. -->
  </head>
  <body class="bg-[#0B0F19] text-gray-200 antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
